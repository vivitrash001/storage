<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>小仓管</title>
<style>
:root{
  --bg:#f7f5f2; --card:#fff; --ink:#2b2a28; --muted:#8a857e; --line:#e6e1da;
  --accent:#c2643f; --accent-ink:#fff; --danger:#c23b3b; --ok:#3c8a5a; --hover:#f1ede7;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#1b1a19; --card:#252321; --ink:#ece8e2; --muted:#9a948c; --line:#3a3734;
    --accent:#e08a63; --accent-ink:#1b1a19; --danger:#e06a6a; --ok:#6fbf8a; --hover:#2e2b29; }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font:16px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans SC","Segoe UI",sans-serif}
.wrap{max-width:760px;margin:0 auto;padding:16px 16px 120px}
header{display:flex;align-items:center;gap:8px;margin-bottom:12px}
header h1{font-size:20px;margin:0;flex:1}
button,select,input{font:inherit;color:inherit}
.btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 14px;cursor:pointer;min-height:40px}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{background:var(--danger);color:#fff;border-color:var(--danger)}
.btn:disabled{opacity:.45;cursor:default}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}
input[type=text],input[type=password],input[type=number],select{
  border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:8px 10px;min-height:40px;width:100%}
.muted{color:var(--muted);font-size:14px}
.crumbs{display:flex;flex-wrap:wrap;gap:4px;align-items:center;font-size:15px;margin:4px 0 10px}
.crumbs a{color:var(--accent);text-decoration:none;cursor:pointer}
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;align-items:center;gap:10px;padding:10px 4px;border-top:1px solid var(--line);min-height:48px}
.list li:first-child{border-top:none}
.list .name{flex:1;min-width:0;overflow-wrap:anywhere;cursor:default}
.list .name.dir{cursor:pointer;font-weight:600}
.list .size{color:var(--muted);font-size:13px;white-space:nowrap}
.list input[type=checkbox]{width:22px;height:22px;flex:none}
.ico{width:22px;text-align:center;flex:none}
.drop{border:2px dashed var(--line);border-radius:14px;padding:18px;text-align:center;color:var(--muted)}
.drop.over{border-color:var(--accent);color:var(--accent);background:var(--hover)}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);
  padding:10px 16px calc(10px + env(safe-area-inset-bottom))}
.bar .inner{max-width:760px;margin:0 auto;display:flex;gap:8px;align-items:center}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:84px;background:var(--ink);color:var(--bg);
  padding:10px 16px;border-radius:10px;max-width:90vw;font-size:14px;display:none;z-index:9}
.log{font-size:13px;color:var(--muted);white-space:pre-wrap;margin-top:8px}
.switch{display:flex;align-items:center;gap:8px}
.switch input{width:20px;height:20px}
.hidden{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>小仓管</h1>
    <button class="btn" id="btnSettings">设置</button>
  </header>

  <!-- 设置 -->
  <section class="card hidden" id="settings">
    <div class="muted" style="margin-bottom:8px">GitHub 访问钥匙（Token）只存在这台设备的浏览器里，只会发给 GitHub。</div>
    <div class="row">
      <input class="grow" type="password" id="token" placeholder="粘贴钥匙 github_pat_…" autocomplete="off">
      <button class="btn primary" id="btnSave">保存</button>
    </div>
    <div class="row" style="margin-top:10px">
      <label class="switch"><input type="checkbox" id="compress"> 上传图片时自动压缩</label>
      <span class="muted">目标</span>
      <input type="number" id="target" min="30" max="2000" step="10" style="width:90px"> <span class="muted">KB</span>
    </div>
    <div class="row" style="margin-top:10px">
      <button class="btn" id="btnLogout">清除钥匙</button>
      <span class="muted" id="who"></span>
    </div>
  </section>

  <!-- 仓库与浏览 -->
  <section class="card hidden" id="browser">
    <div class="row">
      <select id="repo" class="grow"></select>
      <button class="btn" id="btnRefresh" title="刷新">刷新</button>
    </div>
    <div class="crumbs" id="crumbs"></div>
    <div class="drop" id="drop">
      把文件拖到这里，或者
      <button class="btn primary" id="btnPick">选文件上传</button>
      <button class="btn" id="btnNewDir">新建文件夹</button>
      <input type="file" id="picker" multiple class="hidden">
      <div class="log" id="log"></div>
    </div>
    <ul class="list" id="list" style="margin-top:10px"></ul>
  </section>

  <section class="card hidden" id="welcome">
    <p style="margin-top:0">第一次用：点右上角「设置」，粘贴 GitHub 访问钥匙。</p>
  </section>
</div>

<div class="bar hidden" id="bar">
  <div class="inner">
    <label class="switch"><input type="checkbox" id="selAll"> 全选</label>
    <span class="grow muted" id="selCount"></span>
    <button class="btn danger" id="btnDelete" disabled>删除</button>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
(() => {
const API = 'https://api.github.com';
const $ = id => document.getElementById(id);
const store = {
  get(k, d){ try{ const v = localStorage.getItem('xcg.'+k); return v === null ? d : v; }catch{ return d; } },
  set(k, v){ try{ localStorage.setItem('xcg.'+k, v); }catch{} },
  del(k){ try{ localStorage.removeItem('xcg.'+k); }catch{} }
};
const state = { token: store.get('token',''), user:null, repo:null, branch:null, path:'', items:[], extraDirs:{} };

function toast(msg, ms=2600){ const t=$('toast'); t.textContent=msg; t.style.display='block';
  clearTimeout(toast._t); toast._t=setTimeout(()=>t.style.display='none', ms); }
function log(msg){ $('log').textContent = msg; }
function fmtSize(n){ if(n==null) return ''; if(n<1024) return n+' B'; if(n<1048576) return (n/1024).toFixed(0)+' KB'; return (n/1048576).toFixed(1)+' MB'; }
const encPath = p => p.split('/').map(encodeURIComponent).join('/');

async function gh(method, url, body){
  const r = await fetch(API+url, { method, headers:{
      'Authorization':'Bearer '+state.token, 'Accept':'application/vnd.github+json',
      'X-GitHub-Api-Version':'2022-11-28', ...(body?{'Content-Type':'application/json'}:{}) },
    body: body?JSON.stringify(body):undefined, cache:'no-store' });
  if(!r.ok){ let m=''; try{ m=(await r.json()).message; }catch{}
    const e=new Error(r.status+' '+(m||r.statusText)); e.status=r.status; throw e; }
  return r.status===204?null:r.json();
}

// ---------- 设置 ----------
$('compress').checked = store.get('compress','1')==='1';
$('target').value = store.get('target','100');
$('compress').onchange = () => store.set('compress', $('compress').checked?'1':'0');
$('target').onchange = () => store.set('target', String(Math.max(30, +$('target').value||100)));
$('btnSettings').onclick = () => $('settings').classList.toggle('hidden');
$('btnSave').onclick = async () => { state.token = $('token').value.trim(); if(!state.token) return;
  store.set('token', state.token); $('token').value=''; await start(); };
$('btnLogout').onclick = () => { if(!confirm('清除这台设备上保存的钥匙？')) return;
  store.del('token'); state.token=''; location.reload(); };

async function start(){
  if(!state.token){ $('welcome').classList.remove('hidden'); $('settings').classList.remove('hidden'); return; }
  try{
    state.user = await gh('GET','/user');
    $('who').textContent = '已登录：'+state.user.login;
    $('welcome').classList.add('hidden'); $('settings').classList.add('hidden');
    $('browser').classList.remove('hidden');
    await loadRepos();
  }catch(e){ toast('钥匙不能用：'+e.message, 5000); $('settings').classList.remove('hidden'); }
}

async function loadRepos(){
  const repos = await gh('GET','/user/repos?per_page=100&sort=updated');
  const sel = $('repo'); sel.innerHTML='';
  for(const r of repos){ const o=document.createElement('option'); o.value=r.full_name;
    o.textContent=r.full_name+(r.private?'  🔒':''); o.dataset.branch=r.default_branch; sel.appendChild(o); }
  const last = store.get('repo',''); if(last && repos.some(r=>r.full_name===last)) sel.value=last;
  sel.onchange = () => { store.set('repo', sel.value); openRepo(); };
  if(repos.length) openRepo(); else toast('钥匙看不到任何仓库');
}
function openRepo(){ const o=$('repo').selectedOptions[0]; state.repo=o.value; state.branch=o.dataset.branch;
  state.extraDirs={}; go(''); }

// ---------- 浏览 ----------
async function go(path){
  state.path = path; renderCrumbs(); $('list').innerHTML='<li class="muted">读取中…</li>';
  try{
    let items = [];
    try{ items = await gh('GET',`/repos/${state.repo}/contents/${encPath(path)}?ref=${encodeURIComponent(state.branch)}`); }
    catch(e){ if(e.status===404 && (path==='' || state.extraDirs[path])) items=[]; else throw e; }
    if(!Array.isArray(items)) items=[items];
    for(const d of Object.keys(state.extraDirs)){
      const parent = d.includes('/')?d.slice(0,d.lastIndexOf('/')):'';
      if(parent===path && !items.some(i=>i.path===d)) items.push({type:'dir',name:d.split('/').pop(),path:d,_new:true});
    }
    items.sort((a,b)=> (a.type===b.type?0:a.type==='dir'?-1:1) || a.name.localeCompare(b.name,'zh'));
    state.items = items; renderList();
  }catch(e){ $('list').innerHTML=''; toast('读取失败：'+e.message,5000); }
}
function renderCrumbs(){
  const c=$('crumbs'); c.innerHTML='';
  const parts = state.path?state.path.split('/'):[];
  const mk=(label,p)=>{ const a=document.createElement('a'); a.textContent=label; a.onclick=()=>go(p); c.appendChild(a); };
  mk(state.repo.split('/')[1],'');
  parts.forEach((p,i)=>{ c.appendChild(document.createTextNode(' / ')); mk(p, parts.slice(0,i+1).join('/')); });
}
function renderList(){
  const ul=$('list'); ul.innerHTML='';
  if(!state.items.length){ ul.innerHTML='<li class="muted">这里是空的</li>'; }
  for(const it of state.items){
    const li=document.createElement('li');
    const cb=document.createElement('input'); cb.type='checkbox'; cb.dataset.path=it.path; cb.dataset.type=it.type;
    if(it._new) cb.disabled=true; cb.onchange=updateBar;
    const ico=document.createElement('span'); ico.className='ico'; ico.textContent = it.type==='dir'?'📁':(/\.(jpe?g|png|gif|webp|heic)$/i.test(it.name)?'🖼️':'📄');
    const nm=document.createElement('span'); nm.className='name'+(it.type==='dir'?' dir':''); nm.textContent=it.name+(it._new?'（新）':'');
    if(it.type==='dir') nm.onclick=()=>go(it.path);
    else if(it.html_url){ nm.style.cursor='pointer'; nm.onclick=()=>window.open(it.html_url,'_blank','noopener'); }
    const sz=document.createElement('span'); sz.className='size'; sz.textContent = it.type==='file'?fmtSize(it.size):'';
    li.append(cb,ico,nm,sz); ul.appendChild(li);
  }
  $('selAll').checked=false; updateBar();
}
function selected(){ return [...document.querySelectorAll('#list input[type=checkbox]:checked')].map(c=>({path:c.dataset.path,type:c.dataset.type})); }
function updateBar(){ const n=selected().length; $('bar').classList.toggle('hidden', !state.items.length);
  $('selCount').textContent = n?`已选 ${n} 项`:''; $('btnDelete').disabled=!n; }
$('selAll').onchange = e => { document.querySelectorAll('#list input[type=checkbox]:not(:disabled)').forEach(c=>c.checked=e.target.checked); updateBar(); };
$('btnRefresh').onclick = () => go(state.path);
$('btnNewDir').onclick = () => { const n=(prompt('新文件夹的名字')||'').trim().replace(/^\/+|\/+$/g,'');
  if(!n) return; const p=(state.path?state.path+'/':'')+n; state.extraDirs[p]=1; go(p);
  toast('已进入新文件夹。往里面上传文件后它才会真正建好。'); };

// ---------- 提交（一次一条记录） ----------
async function commit(changes, message){
  // changes: [{path, content(base64)|null}]
  const ref = await gh('GET',`/repos/${state.repo}/git/ref/heads/${encodeURIComponent(state.branch)}`);
  const head = await gh('GET',`/repos/${state.repo}/git/commits/${ref.object.sha}`);
  const tree = [];
  for(const c of changes){
    if(c.content===null){ tree.push({path:c.path, mode:'100644', type:'blob', sha:null}); continue; }
    const blob = await gh('POST',`/repos/${state.repo}/git/blobs`,{content:c.content, encoding:'base64'});
    tree.push({path:c.path, mode:'100644', type:'blob', sha:blob.sha});
  }
  const newTree = await gh('POST',`/repos/${state.repo}/git/trees`,{base_tree:head.tree.sha, tree});
  const nc = await gh('POST',`/repos/${state.repo}/git/commits`,{message, tree:newTree.sha, parents:[head.sha]});
  await gh('PATCH',`/repos/${state.repo}/git/refs/heads/${encodeURIComponent(state.branch)}`,{sha:nc.sha});
}

// ---------- 删除 ----------
$('btnDelete').onclick = async () => {
  const sel = selected(); if(!sel.length) return;
  const names = sel.map(s=>s.path.split('/').pop()+(s.type==='dir'?'/（整个文件夹）':'')).join('\n');
  if(!confirm(`确定删除这 ${sel.length} 项？\n\n${names}\n\n删了还能从历史记录里找回。`)) return;
  $('btnDelete').disabled=true; log('正在删除…');
  try{
    let paths = sel.filter(s=>s.type!=='dir').map(s=>s.path);
    const dirs = sel.filter(s=>s.type==='dir').map(s=>s.path+'/');
    if(dirs.length){
      const t = await gh('GET',`/repos/${state.repo}/git/trees/${encodeURIComponent(state.branch)}?recursive=1`);
      if(t.truncated) throw new Error('仓库太大，没法一次删整个文件夹');
      for(const e of t.tree) if(e.type==='blob' && dirs.some(d=>e.path.startsWith(d))) paths.push(e.path);
    }
    paths=[...new Set(paths)];
    await commit(paths.map(p=>({path:p,content:null})), `删除 ${paths.length} 个文件（小仓管）`);
    log(''); toast(`删好了，共 ${paths.length} 个文件`); go(state.path);
  }catch(e){ log(''); toast('删除失败：'+e.message,6000); updateBar(); }
};

// ---------- 图片压缩 ----------
const IMG = /^image\/(jpeg|png|webp|heic|heif)$/i;
function toBlob(canvas, q){ return new Promise(r=>canvas.toBlob(r,'image/jpeg',q)); }
async function loadBitmap(file){
  try{ return await createImageBitmap(file,{imageOrientation:'from-image'}); }
  catch{ const url=URL.createObjectURL(file); try{ const img=new Image(); img.src=url; await img.decode(); return img; } finally{ setTimeout(()=>URL.revokeObjectURL(url),1000);} }
}
async function compressImage(file, targetKB){
  const target = targetKB*1024;
  if(file.size <= target && /jpe?g$/i.test(file.type)) return {blob:file, changed:false};
  const bmp = await loadBitmap(file);
  const W = bmp.width, H = bmp.height;
  let scale = Math.min(1, 1600/Math.max(W,H));
  let best = null;
  for(let round=0; round<8; round++){
    const c=document.createElement('canvas'); c.width=Math.max(1,Math.round(W*scale)); c.height=Math.max(1,Math.round(H*scale));
    const g=c.getContext('2d'); g.fillStyle='#fff'; g.fillRect(0,0,c.width,c.height); g.drawImage(bmp,0,0,c.width,c.height);
    let lo=0.35, hi=0.92, fit=null;
    for(let i=0;i<7;i++){ const q=(lo+hi)/2; const b=await toBlob(c,q);
      if(b.size<=target){ fit=b; lo=q; } else hi=q; }
    if(fit){ best=fit; break; }
    best = await toBlob(c,0.35); scale*=0.8;
  }
  if(bmp.close) bmp.close();
  return {blob:best, changed:true};
}
const b64 = blob => new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(String(r.result).split(',')[1]); r.onerror=rej; r.readAsDataURL(blob); });

// ---------- 上传 ----------
async function upload(files){
  files=[...files]; if(!files.length) return;
  const doCompress = $('compress').checked, targetKB = Math.max(30, +$('target').value||100);
  const existing = new Set(state.items.map(i=>i.name));
  const changes=[], notes=[];
  try{
    for(let i=0;i<files.length;i++){
      const f=files[i]; log(`准备中 ${i+1}/${files.length}：${f.name}`);
      let blob=f, name=f.name;
      if(doCompress && (IMG.test(f.type) || /\.(jpe?g|png|webp|heic)$/i.test(f.name))){
        try{ const r=await compressImage(f,targetKB);
          if(r.changed){ blob=r.blob; name=name.replace(/\.[^.]+$/,'')+'.jpg'; notes.push(`${f.name}：${fmtSize(f.size)} → ${fmtSize(blob.size)}`); } }
        catch(e){ notes.push(`${f.name}：压缩失败，传原图`); }
      }
      changes.push({path:(state.path?state.path+'/':'')+name, content:await b64(blob), name});
    }
    const dup = changes.filter(c=>existing.has(c.name)).map(c=>c.name);
    if(dup.length && !confirm(`这些文件已经存在，会被覆盖：\n\n${dup.join('\n')}\n\n继续吗？`)){ log(''); return; }
    log(`上传中…（${changes.length} 个文件）`);
    await commit(changes.map(({path,content})=>({path,content})), `上传 ${changes.length} 个文件（小仓管）`);
    for(const c of changes){ const d=c.path.split('/').slice(0,-1).join('/'); delete state.extraDirs[d]; }
    log(notes.length?('压缩：\n'+notes.join('\n')):''); toast(`传好了，共 ${changes.length} 个文件`); go(state.path);
  }catch(e){ log(''); toast('上传失败：'+e.message,6000); }
}
$('btnPick').onclick = () => $('picker').click();
$('picker').onchange = e => { upload(e.target.files); e.target.value=''; };
const drop=$('drop');
['dragenter','dragover'].forEach(t=>drop.addEventListener(t,e=>{e.preventDefault(); drop.classList.add('over');}));
['dragleave','drop'].forEach(t=>drop.addEventListener(t,e=>{e.preventDefault(); drop.classList.remove('over');}));
drop.addEventListener('drop', e => upload(e.dataTransfer.files));
window.addEventListener('dragover', e=>e.preventDefault()); window.addEventListener('drop', e=>e.preventDefault());

window.__xcg = { compressImage, state };
start();
})();
</script>
</body>
</html>
